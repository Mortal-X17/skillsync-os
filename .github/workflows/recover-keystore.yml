name: Recover SkillSync Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest

    steps:
      - name: Check secret exists
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          echo "Keystore secret is present."

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > skillsync-release.jks
          chmod 600 skillsync-release.jks

          if [ ! -s skillsync-release.jks ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          echo "Keystore successfully recovered."

      - name: Upload recovered keystore
        uses: actions/upload-artifact@v4
        with:
          name: skillsync-release-keystore
          path: skillsync-release.jks
          retention-days: 1